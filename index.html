<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPad 狼人殺</title>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
    .card { background: #333; padding: 20px; border-radius: 10px; margin: 15px auto; max-width: 450px; }
    button { background: #e74c3c; color: white; border: none; padding: 8px 16px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 5px; }
    button:disabled { background: #777; cursor: not-allowed; }
    input { padding: 10px; font-size: 16px; border-radius: 5px; border: none; }
    .hidden { display: none; }
    
    /* 角色設定列表樣式 */
    .role-setting { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; background: #444; padding: 5px 15px; border-radius: 5px; }
    .btn-counter { background: #3498db; width: 32px; height: 32px; font-weight: bold; border-radius: 50%; padding: 0; }
    .badge { background: #f39c12; padding: 3px 8px; border-radius: 10px; font-size: 14px; }
  </style>
  
  <!-- 載入 Firebase 模組 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4_tS-4ubsozDX8i_74OueH9dOELyquw4",
      authDomain: "wolfkill-54199.firebaseapp.com",
      databaseURL: "https://wolfkill-54199-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "wolfkill-54199",
      storageBucket: "wolfkill-54199.firebasestorage.app",
      messagingSenderId: "79536102733",
      appId: "1:79536102733:web:070fbd11247de252e52b04",
      measurementId: "G-VVMNC5XD8B"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let myPlayerId = "";
    let myRole = "";
    let totalPlayersCount = 0;

    // 預設身分數量 (預設總共 6 人)
    let roleCounts = {
      "狼人": 1,
      "警察": 1,
      "平民": 1,
      "醫生": 1,
      "女巫": 1,
      "獵人": 1
    };

    // 建立/加入房間
    window.joinGame = function() {
      const name = document.getElementById('playerName').value;
      if (!name) return alert("請輸入暱稱");
      
      myPlayerId = "p_" + Math.random().toString(36).substr(2, 9);
      set(ref(db, 'room/players/' + myPlayerId), {
        name: name,
        role: "未分配",
        isAlive: true,
        potions: { heal: 1, poison: 1 },
        injections: 2
      });

      document.getElementById('login-area').classList.add('hidden');
      document.getElementById('lobby-area').classList.remove('hidden');
    };

    // 調整身分數量 (+1 / -1)
    window.adjustRole = function(role, change) {
      if (roleCounts[role] + change < 0) return;
      roleCounts[role] += change;
      updateRoleSettingsUI();
    };

    // 更新角色數量設定 UI
    function updateRoleSettingsUI() {
      let totalSelectedRoles = 0;
      for (let role in roleCounts) {
        document.getElementById(`count-${role}`).innerText = roleCounts[role];
        totalSelectedRoles += roleCounts[role];
      }

      document.getElementById('role-summary').innerText = `已設定身分總數：${totalSelectedRoles} / 房間人數：${totalPlayersCount}`;

      const startBtn = document.getElementById('start-btn');
      if (totalSelectedRoles === totalPlayersCount && totalPlayersCount > 0) {
        startBtn.disabled = false;
        startBtn.innerText = "身分相符，正式發牌開始！";
      } else {
        startBtn.disabled = true;
        startBtn.innerText = `身分數量與玩家人數不符 (${totalSelectedRoles}/${totalPlayersCount})`;
      }
    }

    // 房主確認身分配置後正式開始
    window.startGame = function() {
      let rolesPool = [];
      for (let role in roleCounts) {
        for (let i = 0; i < roleCounts[role]; i++) {
          rolesPool.push(role);
        }
      }

      // 洗牌 (Random Shuffle)
      rolesPool.sort(() => Math.random() - 0.5);

      onValue(ref(db, 'room/players'), (snapshot) => {
        const players = snapshot.val();
        if (!players) return;
        
        let keys = Object.keys(players);
        keys.forEach((id, index) => {
          if (rolesPool[index]) {
            update(ref(db, `room/players/${id}`), { role: rolesPool[index] });
          }
        });
        update(ref(db, 'room'), { phase: 'NIGHT_START' });
      }, { onlyOnce: true });
    };

    // 即時監聽資料庫變更
    onValue(ref(db, 'room'), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      // 更新玩家清單與統計人數
      if (data.players) {
        let listHtml = "";
        let playerKeys = Object.keys(data.players);
        totalPlayersCount = playerKeys.length;

        playerKeys.forEach((id) => {
          listHtml += `<li>👤 ${data.players[id].name}</li>`;
          if (id === myPlayerId) {
            myRole = data.players[id].role;
          }
        });

        document.getElementById('player-count').innerText = totalPlayersCount;
        document.getElementById('player-list').innerHTML = listHtml;
        
        // 重新檢核身分總數與人數
        updateRoleSettingsUI();
      }

      // 切換至遊戲進行階段
      if (data.phase && data.phase !== 'LOBBY') {
        document.getElementById('lobby-area').classList.add('hidden');
        document.getElementById('game-area').classList.remove('hidden');
        document.getElementById('phase-text').innerText = "遊戲開始！夜晚降臨...";
      }
    });

    // 查看身份按鈕
    window.toggleRole = function() {
      const card = document.getElementById('role-card');
      if (card.innerText === "點擊翻開卡片") {
        card.innerText = "你的身分是：" + myRole;
      } else {
        card.innerText = "點擊翻開卡片";
      }
    };
  </script>
</head>
<body>

  <h1>iPad 網頁版狼人殺</h1>

  <!-- 1. 登入區域 -->
  <div id="login-area" class="card">
    <h3>輸入暱稱加入房間</h3>
    <input type="text" id="playerName" placeholder="例如：玩家 A"><br><br>
    <button onclick="joinGame()">加入房間</button>
  </div>

  <!-- 2. 等待室區域 -->
  <div id="lobby-area" class="card hidden">
    <h3>🎮 玩家大廳 (在線人數：<span id="player-count">0</span> 人)</h3>
    
    <ul id="player-list" style="list-style:none; padding:0; text-align:left; max-width: 200px; margin: 10px auto; line-height: 1.8;"></ul>

    <hr style="border-color: #555; margin: 20px 0;">

    <h3>⚙️ 身分數量設定 (房主操作)</h3>
    
    <div class="role-setting">
      <span>🐺 狼人</span>
      <div>
        <button class="btn-counter" onclick="adjustRole('狼人', -1)">-</button>
        <span id="count-狼人" class="badge">1</span>
        <button class="btn-counter" onclick="adjustRole('狼人', 1)">+</button>
      </div>
    </div>

    <div class="role-setting">
      <span>👮 警察</span>
      <div>
        <button class="btn-counter" onclick="adjustRole('警察', -1)">-</button>
        <span id="count-警察" class="badge">1</span>
        <button class="btn-counter" onclick="adjustRole('警察', 1)">+</button>
      </div>
    </div>

    <div class="role-setting">
      <span>👨‍🌾 平民</span>
      <div>
        <button class="btn-counter" onclick="adjustRole('平民', -1)">-</button>
        <span id="count-平民" class="badge">1</span>
        <button class="btn-counter" onclick="adjustRole('平民', 1)">+</button>
      </div>
    </div>

    <div class="role-setting">
      <span>🩺 醫生</span>
      <div>
        <button class="btn-counter" onclick="adjustRole('醫生', -1)">-</button>
        <span id="count-醫生" class="badge">1</span>
        <button class="btn-counter" onclick="adjustRole('醫生', 1)">+</button>
      </div>
    </div>

    <div class="role-setting">
      <span>🧙‍♀️ 女巫</span>
      <div>
        <button class="btn-counter" onclick="adjustRole('女巫', -1)">-</button>
        <span id="count-女巫" class="badge">1</span>
        <button class="btn-counter" onclick="adjustRole('女巫', 1)">+</button>
      </div>
    </div>

    <div class="role-setting">
      <span>🏹 獵人</span>
      <div>
        <button class="btn-counter" onclick="adjustRole('獵人', -1)">-</button>
        <span id="count-獵人" class="badge">1</span>
        <button class="btn-counter" onclick="adjustRole('獵人', 1)">+</button>
      </div>
    </div>

    <p id="role-summary" style="font-size:14px; color:#f39c12; font-weight:bold; margin-top:15px;"></p>

    <button id="start-btn" onclick="startGame()" disabled>等待人數與身分相符...</button>
  </div>

  <!-- 3. 遊戲進行區域 -->
  <div id="game-area" class="card hidden">
    <h2 id="phase-text">等待遊戲開始...</h2>
    
    <div class="card" id="role-card" onclick="toggleRole()" style="cursor:pointer; background:#555; padding: 40px 20px; font-size: 20px;">
      點擊翻開卡片
    </div>
  </div>

</body>
</html>
