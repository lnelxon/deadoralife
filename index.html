<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>死或活 · Werewolf</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+TC:wght@400;500;700;900&display=swap');

    :root{
      --bg:#0a0a0f;
      --bg2:#12121c;
      --panel:#171723;
      --panel2:#1e1e2c;
      --blood:#b71c1c;
      --blood2:#7b0e0e;
      --blood3:#e23b3b;
      --gold:#d9b25a;
      --gold2:#8a6d2f;
      --bone:#ece6d6;
      --bone-dim:#a7a092;
      --muted:#6f6f80;
      --good:#2ecc71;
      --good2:#1e8449;
      --info:#3a6ea5;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:'Noto Serif TC','Cinzel',serif;
      background:
        radial-gradient(1100px 620px at 50% -12%, #23232f 0%, transparent 58%),
        radial-gradient(760px 520px at 86% 14%, rgba(183,28,28,0.16), transparent 55%),
        radial-gradient(620px 460px at 12% 78%, rgba(60,40,90,0.18), transparent 60%),
        linear-gradient(180deg,#0a0a0f 0%,#060609 100%);
      background-attachment:fixed;
      color:var(--bone);
      text-align:center;
      padding:22px 14px 70px;
      min-height:100vh;
      letter-spacing:0.02em;
      position:relative;
      overflow-x:hidden;
    }
    /* 遠方血月 */
    body::before{
      content:"";
      position:fixed;
      top:-120px; right:-90px;
      width:340px; height:340px;
      border-radius:50%;
      background:radial-gradient(circle at 38% 38%, #e8c98a 0%, #c98a3a 30%, #7b2a1a 62%, #3a0f0a 100%);
      box-shadow:0 0 120px 30px rgba(183,28,28,0.30), inset -30px -30px 70px rgba(0,0,0,0.55);
      opacity:0.55;
      z-index:0;
      pointer-events:none;
    }
    /* 細紋噪點 */
    body::after{
      content:"";
      position:fixed; inset:0;
      background-image:repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 6px);
      pointer-events:none;
      z-index:0;
    }

    h1,h2,h3,h4{font-family:'Noto Serif TC',serif; color:var(--bone); position:relative; z-index:1;}

    .card{
      background:linear-gradient(180deg, rgba(30,30,44,0.92), rgba(18,18,28,0.92));
      padding:24px 22px;
      border-radius:14px;
      margin:18px auto;
      max-width:480px;
      position:relative;
      z-index:1;
      border:1px solid rgba(217,178,90,0.22);
      box-shadow:0 14px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    /* 標題 */
    .game-title{
      font-family:'Noto Serif TC',serif;
      font-weight:900;
      font-size:clamp(40px,9vw,68px);
      letter-spacing:0.22em;
      margin:6px 0 0;
      background:linear-gradient(180deg,#f3ead2 0%,#d9b25a 55%,#8a5a1f 100%);
      -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:0 2px 18px rgba(183,28,28,0.25);
      position:relative; z-index:1;
    }
    .game-sub{
      font-family:'Cinzel',serif;
      font-weight:700;
      letter-spacing:0.55em;
      font-size:clamp(11px,2.6vw,15px);
      color:var(--blood3);
      margin:4px 0 2px;
      opacity:0.92;
      text-indent:0.55em;
    }
    .game-tag{
      color:var(--bone-dim);
      font-size:13px;
      letter-spacing:0.18em;
      margin:8px auto 4px;
      opacity:0.8;
    }
    .moon-divider{
      display:flex; align-items:center; justify-content:center; gap:14px;
      color:var(--gold); opacity:0.55; margin:14px 0 6px; font-size:14px;
    }
    .moon-divider::before,.moon-divider::after{
      content:""; height:1px; width:60px;
      background:linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    button{
      font-family:'Noto Serif TC',serif;
      background:linear-gradient(135deg,var(--blood),var(--blood2));
      color:#fff;
      border:1px solid rgba(255,255,255,0.12);
      padding:11px 20px;
      font-size:16px;
      border-radius:8px;
      cursor:pointer;
      margin:6px;
      letter-spacing:0.06em;
      transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;
      box-shadow:0 4px 14px rgba(0,0,0,0.4);
    }
    button:hover{filter:brightness(1.12); transform:translateY(-1px);}
    button:active{transform:translateY(0);}
    button:disabled{background:#3a3a48; cursor:not-allowed; opacity:0.6; box-shadow:none; filter:none; transform:none;}
    .btn-secondary{background:linear-gradient(135deg,#3a6ea5,#26436b);}
    .btn-danger{background:linear-gradient(135deg,#c0392b,#6e1a12);}
    .btn-success{background:linear-gradient(135deg,#27ae60,#145a32);}
    .btn-gold{background:linear-gradient(135deg,#d9b25a,#8a6d2f); color:#1a1206; font-weight:700;}
    .btn-ghost{background:transparent; border:1px solid rgba(217,178,90,0.5); color:var(--gold);}

    input{
      padding:11px 14px; font-size:16px; border-radius:8px; border:1px solid rgba(217,178,90,0.28);
      margin:5px; width:86%; text-align:center; background:rgba(8,8,12,0.7); color:var(--bone);
      font-family:'Noto Serif TC',serif; letter-spacing:0.04em;
    }
    input::placeholder{color:var(--muted);}
    input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 2px rgba(217,178,90,0.18);}
    .hidden{display:none !important;}

    #host-controls{position:fixed; top:14px; right:14px; z-index:100; display:flex; gap:8px;}
    #host-controls button{font-size:13px; padding:7px 13px; margin:0;}

    .role-setting{display:flex; justify-content:space-between; align-items:center; margin:3px 0; background:rgba(8,8,14,0.6); padding:3px 12px; border-radius:7px; border:1px solid rgba(255,255,255,0.05); font-size:15px;}
    .btn-counter{background:linear-gradient(135deg,#3a6ea5,#26436b); width:30px; height:30px; font-weight:bold; border-radius:50%; padding:0; margin:0; font-size:15px;}
    .badge{background:linear-gradient(135deg,#d9b25a,#8a6d2f); color:#1a1206; padding:2px 9px; border-radius:10px; font-size:13px; font-weight:700;}

    .player-slot{background:rgba(8,8,14,0.55); margin:6px 0; padding:10px 12px; border-radius:8px; text-align:left; border:1px solid rgba(255,255,255,0.05);}
    .slot-empty{color:var(--muted); font-style:italic;}
    #seat-controls{margin:16px 0; background:rgba(8,8,14,0.55); padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.05);}

    #phase-host-controls{margin-top:20px; padding-top:16px; border-top:1px dashed rgba(217,178,90,0.3);}
    .target-btn{display:block; width:92%; margin:9px auto; font-size:18px; text-align:left; padding:12px 16px;}

    .in-game-list{background:rgba(8,8,14,0.6); padding:13px 15px; border-radius:10px; margin-bottom:18px; text-align:left; border:1px solid rgba(255,255,255,0.05);}
    .in-game-list h4{margin:0 0 10px 0; color:var(--gold); letter-spacing:0.1em;}
    .list-item{margin:6px 0; font-size:16px; border-bottom:1px solid rgba(255,255,255,0.06); padding-bottom:6px; display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
    .list-item.is-dead{opacity:0.72;}
    .list-item.is-dead .pname{color:#7c7c88; text-decoration:line-through;}
    .pill{font-size:13px; padding:2px 9px; border-radius:11px; white-space:nowrap;}
    .pill-locked{background:rgba(46,204,113,0.18); color:#7be0a3; border:1px solid rgba(46,204,113,0.4);}
    .pill-vote{background:rgba(241,196,15,0.16); color:#f3d77a; border:1px solid rgba(241,196,15,0.35);}
    .peek-btn{background:rgba(217,178,90,0.14); border:1px solid rgba(217,178,90,0.4); color:var(--gold); font-size:12px; padding:2px 8px; border-radius:8px; cursor:pointer; margin:0 0 0 2px; line-height:1.4;}
    .peek-btn:hover{filter:brightness(1.2);}

    .flip-container{perspective:1000px; width:240px; height:320px; margin:25px auto;}
    .flip-card{position:relative; width:100%; height:100%; transition:transform 0.6s; transform-style:preserve-3d; cursor:pointer;}
    .flip-card.flipped{transform:rotateY(180deg);}
    .flip-face{position:absolute; width:100%; height:100%; backface-visibility:hidden; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; box-shadow:0 10px 26px rgba(0,0,0,0.5);}
    .flip-front{background:linear-gradient(135deg,#2c3e50,#10101c); border:2px solid var(--gold);}
    .flip-front .moon{font-size:60px;}
    .flip-back{transform:rotateY(180deg); color:#fff; border:2px solid rgba(255,255,255,0.35);}
    .flip-back .role-icon{font-size:72px; margin-bottom:12px;}
    .flip-back .role-name{font-size:28px; font-weight:bold; margin-bottom:12px;}
    .flip-back .role-desc{font-size:14px; opacity:0.92; line-height:1.6; text-align:center;}

    #vote-timer{font-size:24px; color:#f3d77a; font-weight:bold; margin:8px 0; letter-spacing:0.08em;}
    .vote-lock-banner{background:linear-gradient(135deg, rgba(46,204,113,0.22), rgba(30,132,73,0.18)); border:1px solid rgba(46,204,113,0.4); padding:12px; border-radius:10px; margin:12px 0; color:#9be8b8;}
    #role-summary-readonly{background:rgba(8,8,14,0.55); padding:12px; border-radius:8px; margin-top:10px; border:1px solid rgba(255,255,255,0.05);}
    #role-readonly-list{text-align:left; max-width:260px; margin:0 auto;}
    .role-readonly-row{display:flex; justify-content:space-between; padding:2px 0;}

    .decide-bar{position:sticky; bottom:0; background:linear-gradient(180deg, rgba(10,10,15,0.2), rgba(10,10,15,0.96)); padding:14px 0 4px; margin-top:10px;}

    /* GAME_OVER */
    .gameover-box{padding:8px 4px 4px;}
    .winner-title{font-family:'Noto Serif TC',serif; font-weight:900; font-size:clamp(34px,8vw,56px); letter-spacing:0.18em; margin:6px 0;}
    .winner-civ{color:#7be0a3; text-shadow:0 0 26px rgba(46,204,113,0.45);}
    .winner-wolf{color:#e23b3b; text-shadow:0 0 30px rgba(183,28,28,0.6);}
    .winner-sub{font-family:'Cinzel',serif; letter-spacing:0.4em; font-size:13px; color:var(--bone-dim); margin-bottom:14px;}
    .death-recap{background:rgba(8,8,14,0.6); border:1px solid rgba(255,255,255,0.06); padding:12px; border-radius:10px; margin:14px auto; max-width:360px; text-align:left;}

    /* 首頁氣氛 */
    .home-hero{padding:6px 0 10px;}
    .home-hero .claw{font-size:30px; opacity:0.5; letter-spacing:0.2em;}
    .home-cta{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
    .home-cta button{font-size:17px; padding:13px;}
    .home-note{color:var(--bone-dim); font-size:12.5px; margin-top:14px; letter-spacing:0.12em; opacity:0.7;}
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4_tS-4ubsozDX8i_74OueH9dOELyquw4",
      authDomain: "wolfkill-54199.firebaseapp.com",
      databaseURL: "https://wolfkill-54199-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "wolfkill-54199",
      storageBucket: "wolfkill-54199.firebasestorage.app",
      messagingSenderId: "79536102733",
      appId: "1:79536102733:web:070fbd11247de252e52b04",
      measurementId: "G-VVMNC5XD8B"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentRoomId = "";
    let myPlayerId = "";
    let myRole = "";
    let isHost = false;
    let isSpectator = true;
    let maxPlayersLimit = 6;
    let currentPlayersCount = 0;
    let localRoleFlipped = false;

    let roleCounts = { "狼人": 1, "警察": 1, "平民": 1, "醫生": 1, "女巫": 1, "獵人": 1 };
    let latestRoomData = null;
    let voteTimerInterval = null;
    let voteTimerFor = null;
    let dayVoteFinalizing = false;
    let wolfAutoAdvancing = false;
    let wolfAutoRound = null;
    let hostPeekIds = new Set();
    let lastActivePlayers = [];

    const roleInfo = {
      "狼人": { icon: "🐺", color: "linear-gradient(135deg,#c0392b,#7b241c)", desc: "每晚與狼隊友一起選擇一位玩家殺害" },
      "警察": { icon: "👮", color: "linear-gradient(135deg,#2980b9,#1a5276)", desc: "每晚可以查驗一位玩家的真實身分" },
      "平民": { icon: "👨‍🌾", color: "linear-gradient(135deg,#7f8c8d,#4d5656)", desc: "沒有特殊能力，靠邏輯推理找出狼人" },
      "醫生": { icon: "🩺", color: "linear-gradient(135deg,#27ae60,#145a32)", desc: "每晚可以救治一位受傷的玩家" },
      "女巫": { icon: "🧙‍♀️", color: "linear-gradient(135deg,#8e44ad,#512e5f)", desc: "擁有解藥與毒藥各一瓶，可救人或毒人" },
      "獵人": { icon: "🏹", color: "linear-gradient(135deg,#d35400,#7e3300)", desc: "被淘汰時可以開槍帶走一位玩家" },
      "觀眾": { icon: "👁️", color: "linear-gradient(135deg,#95a5a6,#616a6b)", desc: "在旁觀戰，無法參與遊戲" }
    };

    window.showCreateRoomMenu = () => { document.getElementById('home-menu').classList.add('hidden'); document.getElementById('create-room-form').classList.remove('hidden'); };
    window.showJoinRoomMenu = () => { document.getElementById('home-menu').classList.add('hidden'); document.getElementById('join-room-form').classList.remove('hidden'); };
    window.showHomeMenu = () => { document.getElementById('create-room-form').classList.add('hidden'); document.getElementById('join-room-form').classList.add('hidden'); document.getElementById('home-menu').classList.remove('hidden'); };

    window.createRoom = function() {
      const name = document.getElementById('hostName').value;
      const maxLimit = parseInt(document.getElementById('maxPlayers').value);

      if (!name) return alert("請輸入暱稱");
      if (!maxLimit || maxLimit < 1) return alert("請輸入有效的玩家人數上限");

      currentRoomId = Math.floor(100 + Math.random() * 900).toString();
      myPlayerId = "p_" + Math.random().toString(36).substr(2, 9);
      isHost = true;
      isSpectator = false;

      set(ref(db, 'rooms/' + currentRoomId), {
        hostId: myPlayerId,
        maxPlayers: maxLimit,
        phase: 'LOBBY',
        roleCounts: roleCounts,
        players: {
          [myPlayerId]: { name: name, role: "未分配", isSpectator: false, isAlive: true, joinedAt: Date.now() }
        }
      });
      listenToRoomData();
    };

    window.joinRoom = function() {
      const name = document.getElementById('joinName').value;
      const roomId = document.getElementById('joinRoomId').value.trim();

      if (!name) return alert("請輸入暱稱");
      if (!roomId) return alert("請輸入房間代碼");

      onValue(ref(db, 'rooms/' + roomId), (snapshot) => {
        const roomData = snapshot.val();
        if (!roomData) return alert("找不到該房間！請確認代碼是否正確。");

        currentRoomId = roomId;
        myPlayerId = "p_" + Math.random().toString(36).substr(2, 9);
        isHost = false;
        isSpectator = true;

        set(ref(db, `rooms/${currentRoomId}/players/${myPlayerId}`), {
          name: name,
          role: "觀眾",
          isSpectator: true,
          isAlive: true,
          joinedAt: Date.now()
        });
        listenToRoomData();
      }, { onlyOnce: true });
    };

    window.toggleSeat = function(wantsToBeSpectator) {
      if (wantsToBeSpectator && isHost) {
        return alert("房主需留在遊戲列才能推進遊戲流程，無法轉為觀眾。");
      }
      if (wantsToBeSpectator) {
        update(ref(db, `rooms/${currentRoomId}/players/${myPlayerId}`), { isSpectator: true, role: "觀眾" });
      } else {
        if (currentPlayersCount >= maxPlayersLimit) return alert("座位已滿，無法加入！");
        update(ref(db, `rooms/${currentRoomId}/players/${myPlayerId}`), { isSpectator: false, role: "未分配" });
      }
    };

    function rolePillStyle(role) {
      const map = {
        "狼人": "background:rgba(183,28,28,0.22);color:#f29292;border:1px solid rgba(183,28,28,0.55);",
        "警察": "background:rgba(58,110,165,0.24);color:#9bc4ec;border:1px solid rgba(58,110,165,0.55);",
        "平民": "background:rgba(46,204,113,0.22);color:#86e6ab;border:1px solid rgba(46,204,113,0.5);",
        "醫生": "background:rgba(39,174,96,0.22);color:#7dd99a;border:1px solid rgba(39,174,96,0.5);",
        "女巫": "background:rgba(142,68,173,0.24);color:#d6a3ec;border:1px solid rgba(142,68,173,0.55);",
        "獵人": "background:rgba(211,84,0,0.24);color:#f3ab6b;border:1px solid rgba(211,84,0,0.55);",
        "觀眾": "background:rgba(149,165,166,0.2);color:#c4cfcf;border:1px solid rgba(149,165,166,0.4);"
      };
      return map[role] || "background:rgba(217,178,90,0.18);color:#e6cf8a;border:1px solid rgba(217,178,90,0.4);";
    }

    function generatePlayerListHTML(activePlayers, voteCounts, confirmedSet, hideRoles) {
      let html = `<div class="in-game-list"><h4>📋 玩家名單</h4>`;
      activePlayers.forEach(p => {
        let status = p.isAlive ? "🟢" : "💀";
        let deadCls = p.isAlive ? "" : "is-dead";
        let roleStr = "";
        if (!p.isAlive) {
          let info = roleInfo[p.role] || {};
          roleStr = `<span class="pill" style="${rolePillStyle(p.role)}">${info.icon || ''} ${p.role}</span>`;
        } else if (!hideRoles) {
          let info = roleInfo[myRole] || {};
          if (p.id === myPlayerId) {
            roleStr = `<span class="pill" style="${rolePillStyle(myRole)}">${info.icon||''} 你 · ${myRole}</span>`;
          } else if (myRole && p.role === myRole && !['平民', '未分配', '觀眾'].includes(myRole)) {
            let pInfo = roleInfo[p.role] || {};
            roleStr = `<span class="pill" style="${rolePillStyle(p.role)}">${pInfo.icon||''} 同伴 · ${p.role}</span>`;
          }
        }
        let peekStr = "";
        if (isHost && p.role && !['未分配', '觀眾'].includes(p.role)) {
          if (hostPeekIds.has(p.id)) {
            let info = roleInfo[p.role] || {};
            peekStr = `<span class="pill" style="${rolePillStyle(p.role)}">👁 ${info.icon||''} ${p.role}</span>`;
          }
          peekStr += ` <button class="peek-btn" onclick="hostPeek('${p.id}')">${hostPeekIds.has(p.id) ? '隱藏' : '👁 查'}</button>`;
        }
        let extra = "";
        if (voteCounts && p.isAlive) {
          let c = voteCounts[p.id] || 0;
          if (c > 0) extra += `<span class="pill pill-vote">🗳️ ${c} 票</span>`;
        }
        if (confirmedSet && confirmedSet[p.id] && p.isAlive) {
          extra += `<span class="pill pill-locked">🔒 已決定</span>`;
        }
        html += `<div class="list-item ${deadCls}">${status} <b class="pname">${p.name}</b> ${roleStr}${peekStr}${extra}</div>`;
      });
      html += `</div>`;
      return html;
    }

    function computeVoteCounts(votesObj) {
      let counts = {};
      if (votesObj) Object.values(votesObj).forEach(t => { counts[t] = (counts[t] || 0) + 1; });
      return counts;
    }

    function checkAgreedTarget(aliveRolePlayers, votesObj) {
      if (aliveRolePlayers.length === 0) return 'NO_ALIVE';
      if (!votesObj) return null;

      let votes = Object.values(votesObj);
      if (votes.length === aliveRolePlayers.length && votes.every(v => v === votes[0])) {
        return votes[0];
      }
      return null;
    }

    function hasRoleInGame(roomData, roleName) {
      if (roomData.roleCounts && roomData.roleCounts[roleName] > 0) return true;
      return false;
    }

    // 勝負判定：考慮本次剛死亡的玩家（roomData.players.isAlive 尚未寫入）
    function checkWinnerAfterDeaths(roomData, newlyDeadIds) {
      const deadSet = new Set(newlyDeadIds || []);
      let aliveCivilians = 0;
      let aliveWolves = 0;
      Object.entries(roomData.players || {}).forEach(([id, p]) => {
        if (p.isSpectator) return;
        const alive = p.isAlive && !deadSet.has(id);
        if (!alive) return;
        if (p.role === '平民') aliveCivilians++;
        if (p.role === '狼人') aliveWolves++;
      });
      if (aliveCivilians === 0) return '狼人';
      if (aliveWolves === 0) return '平民';
      return null;
    }

    function nightResetUpdates(round) {
      return {
        phase: 'NIGHT_WOLF',
        round: round,
        wolfVotes: null,
        wolfLocked: null,
        policeVotes: null,
        policeResult: null,
        doctorTarget: null,
        witchAction: null,
        killedByWolf: null,
        lastNightDeaths: null,
        dayVotes: null,
        dayConfirmed: null,
        dayResultText: null,
        dayEliminatedId: null,
        voteEndTime: null,
        winner: null
      };
    }

    function listenToRoomData() {
      onValue(ref(db, 'rooms/' + currentRoomId), (snapshot) => {
        const roomData = snapshot.val();
        if (!roomData) {
          alert("房間已被關閉！將返回首頁。");
          location.reload();
          return;
        }

        latestRoomData = roomData;
        maxPlayersLimit = roomData.maxPlayers;
        if (roomData.roleCounts) roleCounts = roomData.roleCounts;
        if (isHost) document.getElementById('host-controls').classList.remove('hidden');

        document.getElementById('home-area').classList.add('hidden');
        document.getElementById('room-info-bar').innerText = `房間代碼：${currentRoomId}  ·  上限 ${maxPlayersLimit} 人`;

        let activePlayers = [];
        let spectators = [];

        if (roomData.players) {
          let playerEntries = Object.entries(roomData.players).sort((a, b) => a[1].joinedAt - b[1].joinedAt);
          playerEntries.forEach(([id, p]) => {
            if (id === myPlayerId) { myRole = p.role; isSpectator = p.isSpectator; }
            if (p.isSpectator) spectators.push({id, ...p});
            else activePlayers.push({id, ...p});
          });
        }
        currentPlayersCount = activePlayers.length;
        lastActivePlayers = activePlayers;

        if (roomData.phase === 'LOBBY') {
          document.getElementById('lobby-area').classList.remove('hidden');
          document.getElementById('game-area').classList.add('hidden');
          document.getElementById('player-count').innerText = currentPlayersCount;
          localRoleFlipped = false;

          let playersListHtml = "";
          for (let i = 0; i < maxPlayersLimit; i++) {
            if (i < activePlayers.length) {
              let p = activePlayers[i];
              playersListHtml += `<div class="player-slot">${i + 1}. 👤 ${p.name} ${p.id === roomData.hostId ? '👑' : ''}</div>`;
            } else {
              playersListHtml += `<div class="player-slot slot-empty">${i + 1}. (空位)</div>`;
            }
          }
          document.getElementById('player-slots').innerHTML = playersListHtml;

          let spectatorsListHtml = "";
          spectators.forEach(p => { spectatorsListHtml += `👁️ ${p.name}<br>`; });
          document.getElementById('spectator-list').innerHTML = spectatorsListHtml || '<span class="slot-empty">目前無觀眾</span>';

          if (isSpectator) {
            document.getElementById('btn-join-game').classList.remove('hidden');
            document.getElementById('btn-join-spec').classList.add('hidden');
            document.getElementById('btn-join-game').disabled = (currentPlayersCount >= maxPlayersLimit);
          } else {
            document.getElementById('btn-join-game').classList.add('hidden');
            document.getElementById('btn-join-spec').classList.remove('hidden');
          }
          updateRoleSettingsUI();
        } else {
          document.getElementById('lobby-area').classList.add('hidden');
          document.getElementById('game-area').classList.remove('hidden');
          renderGamePhase(roomData, activePlayers);
        }
      });
    }

    function renderGamePhase(roomData, activePlayers) {
      const gameContent = document.getElementById('game-content');
      const hostControls = document.getElementById('phase-host-controls');
      const btnHostNext = document.getElementById('btn-host-next');
      hostControls.classList.add('hidden');

      const isVote = roomData.phase === 'DAY_VOTE';
      const hideRoles = (roomData.phase === 'CARD_REVEAL' && !localRoleFlipped);
      let baseHTML = generatePlayerListHTML(activePlayers, isVote ? computeVoteCounts(roomData.dayVotes) : null, isVote ? (roomData.dayConfirmed || null) : null, hideRoles);

      if (roomData.phase !== 'DAY_VOTE' && voteTimerInterval) {
        clearInterval(voteTimerInterval);
        voteTimerInterval = null;
        voteTimerFor = null;
      }

      // --- 0. 遊戲結束階段（觀眾也可見，所以放在 spectator return 之前） ---
      if (roomData.phase === 'GAME_OVER') {
        const winner = roomData.winner;
        const isWolfWin = winner === '狼人';
        let recapHtml = "";
        if (roomData.lastNightDeaths && roomData.lastNightDeaths.length) {
          let names = roomData.lastNightDeaths.map(id => roomData.players[id]?.name || '未知').join('、');
          recapHtml += `<div>🌙 昨夜淘汰：${names}</div>`;
        }
        if (roomData.dayResultText) {
          recapHtml += `<div>🗳️ ${roomData.dayResultText}</div>`;
        }
        // 身分大公開
        let rosterHtml = activePlayers.map(p => {
          let info = roleInfo[p.role] || {};
          let st = p.isAlive ? '🟢' : '💀';
          let deadCls = p.isAlive ? '' : 'is-dead';
          return `<div class="list-item ${deadCls}">${st} <b class="pname">${p.name}</b> <span class="pill" style="${rolePillStyle(p.role)}">${info.icon || ''} ${p.role}</span></div>`;
        }).join('');
        let rosterBlock = `<div class="in-game-list"><h4>🎭 身分大公開</h4>${rosterHtml}</div>`;
        gameContent.innerHTML = baseHTML + `
          <div class="card gameover-box">
            <div class="winner-sub">END OF THE HUNT</div>
            <div class="winner-title ${isWolfWin ? 'winner-wolf' : 'winner-civ'}">${isWolfWin ? '🐺 狼人勝利' : '🌾 平民勝利'}</div>
            <p style="color:var(--bone-dim); margin:6px 0 12px;">${isWolfWin ? '所有平民已被獵殺殆盡，黑夜吞噬了村莊。' : '狼人全數伏誅，村莊迎來了黎明。'}</p>
            ${recapHtml ? `<div class="death-recap">${recapHtml}</div>` : ''}
            ${rosterBlock}
          </div>`;
        if (isHost) {
          hostControls.classList.remove('hidden');
          btnHostNext.innerText = "🔄 返回大廳再來一局";
          btnHostNext.disabled = false;
          btnHostNext.onclick = () => restartGame();
        }
        return;
      }

      if (isSpectator) {
        gameContent.innerHTML = baseHTML + `<div class="card" style="background:#2a2a36;">👁️ 您目前為觀眾席，無法參與遊戲操作<br>目前階段：${getPhaseName(roomData.phase)}</div>`;
        return;
      }

      // --- 1. 確認身分階段 ---
      if (roomData.phase === 'CARD_REVEAL') {
        let info = roleInfo[myRole] || { icon: '❓', color: '#555', desc: '' };
        gameContent.innerHTML = baseHTML + `
          <h2>🃏 請確認你的身分</h2>
          <div class="flip-container">
            <div class="flip-card ${localRoleFlipped ? 'flipped' : ''}" id="role-card" onclick="toggleRole()">
              <div class="flip-face flip-front">
                <div class="moon">🌙</div>
                <p style="margin-top:15px; font-size:16px; color:var(--gold);">點擊翻牌查看身分</p>
              </div>
              <div class="flip-face flip-back" style="background:${info.color};">
                <div class="role-icon">${info.icon}</div>
                <div class="role-name">${myRole}</div>
                <div class="role-desc">${info.desc}</div>
              </div>
            </div>
          </div>`;

        if (isHost) {
          hostControls.classList.remove('hidden');
          btnHostNext.innerText = "遊戲開始";
          btnHostNext.disabled = false;
          btnHostNext.onclick = () => update(ref(db, `rooms/${currentRoomId}`), { phase: 'DAY_DISCUSS' });
        }
      }
      // --- 2. 白天發言階段 ---
      else if (roomData.phase === 'DAY_DISCUSS') {
        gameContent.innerHTML = baseHTML + `
          <h2>🗣️ 白天 · 發言時間</h2>
          <p style="font-size:20px; color:var(--gold); font-weight:bold; margin: 20px 0;">請大家輪流發言，夜晚即將來臨</p>
        `;
        if (isHost) {
          hostControls.classList.remove('hidden');
          btnHostNext.innerText = "天黑請閉眼";
          btnHostNext.disabled = false;
          btnHostNext.onclick = () => {
            update(ref(db, `rooms/${currentRoomId}`), nightResetUpdates(1));
          };
        }
      }
      // --- 3. 夜晚：狼人回合 ---
      else if (roomData.phase === 'NIGHT_WOLF') {
        let isDead = !roomData.players[myPlayerId].isAlive;
        let html = baseHTML;

        if (isDead) {
          html += `<h2>👻 你已死亡，請安靜觀戰</h2>`;
        } else if (myRole === '狼人') {
          const locked = !!(roomData.wolfLocked && roomData.wolfLocked[myPlayerId]);
          let aliveWolves = activePlayers.filter(p => p.role === '狼人' && p.isAlive);
          let lockedCount = aliveWolves.filter(w => roomData.wolfLocked && roomData.wolfLocked[w.id]).length;
          html += `<h2>🐺 狼人行動 (第 ${roomData.round || 1} 夜)</h2><p style="color:#e23b3b;">請選擇要殺害的對象，選好後按下「確認鎖定」：</p>`;
          activePlayers.filter(p => p.isAlive && p.role !== '狼人').forEach(p => {
            let voteCount = 0;
            let isMyTarget = false;
            if (roomData.wolfVotes) {
              Object.keys(roomData.wolfVotes).forEach(wolfId => {
                if (roomData.wolfVotes[wolfId] === p.id) {
                  voteCount++;
                  if (wolfId === myPlayerId) isMyTarget = true;
                }
              });
            }
            let wolfIcons = '🐺'.repeat(voteCount);
            let btnClass = isMyTarget ? 'btn-danger' : 'btn-secondary';
            let disAttr = locked ? 'disabled' : '';
            html += `<button class="target-btn ${btnClass}" ${disAttr} onclick="voteAction('wolfVotes', '${p.id}')">
                      ${p.name} ${isMyTarget ? '🎯 (你選他)' : ''} ${wolfIcons}
                     </button>`;
          });
          if (locked) {
            let myVote = roomData.wolfVotes && roomData.wolfVotes[myPlayerId];
            let tName = myVote ? (roomData.players[myVote]?.name || '某玩家') : '未選擇';
            html += `<div class="vote-lock-banner">🔒 你已鎖定擊殺目標：<b>${tName}</b><br>等待狼隊全數鎖定同一目標... (${lockedCount}/${aliveWolves.length})</div>`;
            html += `<div class="decide-bar"><button class="btn-ghost" style="width:92%; font-size:16px; padding:11px;" onclick="cancelWolfLock()">↩️ 取消鎖定，重新選擇</button></div>`;
          } else {
            let myVote = roomData.wolfVotes && roomData.wolfVotes[myPlayerId];
            let label = myVote ? '🔒 確認鎖定目標' : '🔒 確認鎖定（請先選擇目標）';
            html += `<div class="decide-bar"><button class="btn-gold" style="width:92%; font-size:18px; padding:13px;" onclick="confirmWolfLock()">${label}</button></div>`;
          }
        } else {
          html += `<h2>🌙 夜晚降臨 (第 ${roomData.round || 1} 夜)</h2><p style="font-size:22px; margin: 30px 0;">狼人行動中，請閉眼稍候...</p>`;
        }
        gameContent.innerHTML = html;

        if (isHost) {
          hostControls.classList.remove('hidden');
          let aliveWolves = activePlayers.filter(p => p.role === '狼人' && p.isAlive);
          let allLocked = aliveWolves.length > 0 && aliveWolves.every(w => roomData.wolfLocked && roomData.wolfLocked[w.id]);
          let agreed = checkAgreedTarget(aliveWolves, roomData.wolfVotes);
          if (roomData.round !== wolfAutoRound) { wolfAutoRound = roomData.round; wolfAutoAdvancing = false; }
          if (allLocked && agreed && agreed !== 'NO_ALIVE' && !wolfAutoAdvancing) {
            wolfAutoAdvancing = true;
            advanceFromWolf(roomData, agreed);
          }
          btnHostNext.innerText = "⚡ 強制下一步（無人被殺）";
          btnHostNext.disabled = false;
          btnHostNext.onclick = () => advanceFromWolf(roomData, null);
        }
      }
      // --- 4. 夜晚：警察回合 ---
      else if (roomData.phase === 'NIGHT_POLICE') {
        let isDead = !roomData.players[myPlayerId].isAlive;
        let html = baseHTML;

        if (isDead) {
          html += `<h2>👻 警察回合 (你已死亡)</h2>`;
        } else if (myRole === '警察') {
          if (roomData.policeResult) {
            let target = activePlayers.find(p => p.id === roomData.policeResult);
            html += `<div style="background:linear-gradient(135deg,#27ae60,#145a32); padding:15px; border-radius:8px; margin-top:20px;">
                        <h3>🔍 調查結果</h3>
                        <p style="font-size:22px;"><b>${target ? target.name : '未知'}</b> 的身分是：<b>${target ? target.role : '未知'}</b></p>
                     </div>`;
          } else {
            html += `<h2>👮 警察行動</h2><p style="color:#5a9bd6;">請選擇你要調查的對象：</p>`;
            let alivePolice = activePlayers.filter(p => p.role === '警察' && p.isAlive);

            activePlayers.filter(p => p.isAlive && p.role !== '警察').forEach(p => {
              let voteCount = 0;
              let isMyTarget = false;
              if (roomData.policeVotes) {
                Object.keys(roomData.policeVotes).forEach(polId => {
                  if (roomData.policeVotes[polId] === p.id) {
                    voteCount++;
                    if (polId === myPlayerId) isMyTarget = true;
                  }
                });
              }
              let icons = '👁️'.repeat(voteCount);
              html += `<button class="target-btn ${isMyTarget ? 'btn-success' : 'btn-secondary'}" onclick="voteAction('policeVotes', '${p.id}')">
                        ${p.name} ${isMyTarget ? '🎯 (你選他)' : ''} ${icons}
                       </button>`;
            });

            let agreedTarget = checkAgreedTarget(alivePolice, roomData.policeVotes);
            if (agreedTarget && agreedTarget !== 'NO_ALIVE') {
              html += `<button class="btn-success" style="width:90%; font-size:20px; padding:15px; margin-top:15px;" onclick="confirmPolice('${agreedTarget}')">✅ 確認調查目標</button>`;
            }
          }
        } else {
          html += `<h2>👮 警察行動中...</h2><p style="font-size:22px;">夜晚中，請稍候...</p>`;
        }
        gameContent.innerHTML = html;

        if (isHost) {
          hostControls.classList.remove('hidden');
          let alivePolice = activePlayers.filter(p => p.role === '警察' && p.isAlive);

          if (alivePolice.length === 0 || roomData.policeResult) {
            btnHostNext.innerText = "下一步";
            btnHostNext.disabled = false;
            btnHostNext.onclick = () => {
              let updates = {};
              if (hasRoleInGame(roomData, '醫生')) {
                updates[`rooms/${currentRoomId}/phase`] = 'NIGHT_DOCTOR';
              } else if (hasRoleInGame(roomData, '女巫')) {
                updates[`rooms/${currentRoomId}/phase`] = 'NIGHT_WITCH';
              } else {
                calculateNightEndViaData(roomData, updates);
                update(ref(db), updates);
                return;
              }
              update(ref(db), updates);
            };
          } else {
            btnHostNext.innerText = "等待警察確認調查...";
            btnHostNext.disabled = true;
          }
        }
      }
      // --- 4.5 夜晚：醫生回合 ---
      else if (roomData.phase === 'NIGHT_DOCTOR') {
        let isDead = !roomData.players[myPlayerId].isAlive;
        let html = baseHTML;

        if (isDead) {
          html += `<h2>👻 醫生回合 (你已死亡)</h2>`;
        } else if (myRole === '醫生') {
          if (roomData.doctorTarget) {
            let target = activePlayers.find(p => p.id === roomData.doctorTarget);
            html += `<div style="background:linear-gradient(135deg,#27ae60,#145a32); padding:15px; border-radius:8px;">
                       <h3>🩺 你已選擇急救：<b>${target ? target.name : '未知'}</b></h3>
                     </div>`;
          } else {
            html += `<h2>🩺 醫生行動</h2><p style="color:#5fd68a;">請選擇今晚要拯救的對象：</p>`;
            activePlayers.filter(p => p.isAlive).forEach(p => {
              let isMyTarget = (roomData.doctorTarget === p.id);
              html += `<button class="target-btn ${isMyTarget ? 'btn-success' : 'btn-secondary'}" onclick="doctorAction('${p.id}')">
                        ${p.name} ${isMyTarget ? '🩺 (已選擇)' : ''}
                       </button>`;
            });
          }
        } else {
          html += `<h2>🩺 醫生行動中...</h2><p style="font-size:22px;">請繼續閉眼稍候...</p>`;
        }
        gameContent.innerHTML = html;

        if (isHost) {
          hostControls.classList.remove('hidden');
          let aliveDoctor = activePlayers.filter(p => p.role === '醫生' && p.isAlive);

          if (aliveDoctor.length === 0 || roomData.doctorTarget) {
            btnHostNext.innerText = "下一步";
            btnHostNext.disabled = false;
            btnHostNext.onclick = () => {
              let updates = {};
              if (hasRoleInGame(roomData, '女巫')) {
                updates[`rooms/${currentRoomId}/phase`] = 'NIGHT_WITCH';
              } else {
                calculateNightEndViaData(roomData, updates);
                update(ref(db), updates);
                return;
              }
              update(ref(db), updates);
            };
          } else {
            btnHostNext.innerText = "等待醫生決定...";
            btnHostNext.disabled = true;
          }
        }
      }
      // --- 5. 夜晚：女巫回合 ---
      else if (roomData.phase === 'NIGHT_WITCH') {
        let isDead = !roomData.players[myPlayerId].isAlive;
        let html = baseHTML;

        if (myRole === '女巫') {
          if (roomData.witchAction) {
            let actionText = roomData.witchAction.type === 'heal' ? '使用了解藥 💉' :
                             roomData.witchAction.type === 'poison' ? '使用了毒藥 🧪' : '沒有使用任何藥水 ⏭️';
            html += `<div style="background:linear-gradient(135deg,#8e44ad,#512e5f); padding:15px; border-radius:8px;">
                       <h3>🧙‍♀️ 今晚行動完畢</h3><p>${actionText}</p>
                     </div>`;
          } else {
            html += `<div style="background:linear-gradient(135deg,#8e44ad,#512e5f); padding:15px; border-radius:8px;">
                       <h3>🧙‍♀️ 女巫行動</h3>`;

            if (roomData.witchState?.hasHeal && roomData.killedByWolf) {
              let victim = activePlayers.find(p => p.id === roomData.killedByWolf);
              let victimName = victim ? victim.name : '未知';
              html += `<p style="color:#f3d77a;">⚠️ 昨晚 <b>${victimName}</b> 遇害了。</p>
                       <button class="btn-success target-btn" onclick="witchAction('heal', '${roomData.killedByWolf}')">💉 使用解藥救他</button><hr>`;
            } else if (roomData.witchState?.hasHeal) {
              html += `<p style="color:#c9c2b3;">⚠️ 昨晚平安夜 (無人遇害)。</p><hr>`;
            }

            if (roomData.witchState?.hasPoison) {
              html += `<p>☠️ 選擇一名玩家使用毒藥：</p>`;
              activePlayers.filter(ap => ap.isAlive).forEach(ap => {
                html += `<button class="btn-danger target-btn" onclick="witchAction('poison', '${ap.id}')">🧪 毒死 ${ap.name}</button>`;
              });
              html += `<hr>`;
            }

            html += `<button class="btn-secondary target-btn" onclick="witchAction('skip', null)">⏭️ 什麼都不做</button></div>`;
          }
        } else {
          html += `<h2>🧙‍♀️ 女巫行動中...</h2><p style="font-size:22px;">請繼續閉眼稍候...</p>`;
        }
        gameContent.innerHTML = html;

        if (isHost) {
          hostControls.classList.remove('hidden');
          let aliveWitch = activePlayers.filter(p => p.role === '女巫' && p.isAlive);

          if (aliveWitch.length === 0 || roomData.witchAction) {
            btnHostNext.innerText = "下一步 (天亮結算)";
            btnHostNext.disabled = false;
            btnHostNext.onclick = () => {
              let updates = {};
              calculateNightEndViaData(roomData, updates);
              update(ref(db), updates);
            };
          } else {
            btnHostNext.innerText = "等待女巫決定...";
            btnHostNext.disabled = true;
          }
        }
      }
      // --- 6. 天亮結算階段 ---
      else if (roomData.phase === 'NIGHT_END') {
        let deadNames = [];
        if (roomData.lastNightDeaths && roomData.lastNightDeaths.length > 0) {
          deadNames = roomData.lastNightDeaths.map(id => {
            let p = roomData.players[id];
            return p ? p.name : '未知';
          });
        }
        let deathText = deadNames.length > 0 ? deadNames.join("、") : "無人 (平安夜)";

        gameContent.innerHTML = baseHTML + `
          <h2>🌅 天亮了</h2>
          <p style="font-size:20px; margin:20px 0;">昨晚被淘汰的玩家是：<br>
          <span style="color:#e23b3b; font-size:32px; font-weight:bold; display:inline-block; margin-top:10px;">${deathText}</span></p>
        `;

        if (isHost) {
          hostControls.classList.remove('hidden');
          btnHostNext.innerText = "進入白天投票環節";
          btnHostNext.disabled = false;
          btnHostNext.onclick = () => update(ref(db, `rooms/${currentRoomId}`), {
            phase: 'DAY_VOTE',
            voteEndTime: Date.now() + 30000,
            dayVotes: null,
            dayConfirmed: null,
            dayResultText: null,
            dayEliminatedId: null
          });
        }
      }
      // --- 7. 白天投票放逐階段 ---
      else if (roomData.phase === 'DAY_VOTE') {
        let isDead = !roomData.players[myPlayerId].isAlive;
        let html = baseHTML;
        let remaining = roomData.voteEndTime ? Math.max(0, Math.ceil((roomData.voteEndTime - Date.now()) / 1000)) : 30;

        html += `<h2>🗳️ 白天投票 (第 ${roomData.round || 1} 天)</h2>`;

        if (!roomData.dayResultText) {
          html += `<p id="vote-timer">⏳ 剩餘 <span id="vote-timer-val">${remaining}</span> 秒</p>`;
        }

        const confirmedSet = roomData.dayConfirmed || {};
        const iConfirmed = !!confirmedSet[myPlayerId];
        let aliveList = activePlayers.filter(p => p.isAlive);
        let confirmedCount = aliveList.filter(p => confirmedSet[p.id]).length;
        let allConfirmed = aliveList.length > 0 && confirmedCount === aliveList.length;

        if (isDead) {
          html += `<p style="color:var(--muted);">你已死亡，無法投票</p>`;
        } else if (!roomData.dayResultText) {
          if (iConfirmed) {
            let myTarget = roomData.dayVotes && roomData.dayVotes[myPlayerId];
            let tName = myTarget ? (roomData.players[myTarget]?.name || '某玩家') : '棄票';
            html += `<div class="vote-lock-banner">🔒 你已鎖定決定（投給：<b>${tName}</b>）<br>等待其餘玩家決定... (${confirmedCount}/${aliveList.length})</div>`;
          } else {
            html += `<p style="color:#5a9bd6;">選擇你認為該淘汰的玩家（再次點擊可撤回），選好後按下「決定」鎖定：</p>`;
            activePlayers.filter(p => p.isAlive).forEach(p => {
              let isMyTarget = roomData.dayVotes && roomData.dayVotes[myPlayerId] === p.id;
              html += `<button class="target-btn ${isMyTarget ? 'btn-danger' : 'btn-secondary'}" onclick="voteAction('dayVotes', '${p.id}')">
                        ${p.name} ${isMyTarget ? '🎯 (你選他，再按一次撤回)' : ''}
                       </button>`;
            });
          }

          if (!iConfirmed) {
            let myTarget = roomData.dayVotes && roomData.dayVotes[myPlayerId];
            let label = myTarget ? `決定 · 鎖定投票` : `決定 · 棄票`;
            html += `<div class="decide-bar">
                       <button class="btn-gold" style="width:92%; font-size:19px; padding:14px;" onclick="confirmDayVote()">✅ ${label}</button>
                     </div>`;
          } else {
            html += `<div class="decide-bar">
                       <button class="btn-ghost" style="width:92%; font-size:16px; padding:11px;" onclick="cancelDayVote()">↩️ 取消決定，重新選擇</button>
                     </div>`;
          }
        }

        if (roomData.dayResultText) {
          html += `<div style="background:linear-gradient(135deg,#c0392b,#6e1a12); padding:15px; border-radius:8px; margin-top:15px;">
                     <h3>📢 投票結果</h3>
                     <p style="font-size:18px;">${roomData.dayResultText}</p>
                   </div>`;
        }

        gameContent.innerHTML = html;

        // 倒數與「全員已決定」監聽：每個裝置都顯示倒數；房主在「時間到」或「全員已決定」時結算。
        // 結算改在 interval 內用最新 latestRoomData 判斷，避免 render 當下用未同步的舊快照導致按鈕卡住。
        if (!roomData.dayResultText && voteTimerFor !== roomData.voteEndTime) {
          if (voteTimerInterval) clearInterval(voteTimerInterval);
          voteTimerFor = roomData.voteEndTime;
          dayVoteFinalizing = false;
          voteTimerInterval = setInterval(() => {
            if (!latestRoomData) return;
            // 結果已公布 → 停止計時
            if (latestRoomData.dayResultText) {
              clearInterval(voteTimerInterval);
              voteTimerInterval = null;
              return;
            }
            // 房主：全員已決定 → 提早結算
            if (isHost) {
              let alive = 0, confirmed = 0;
              Object.entries(latestRoomData.players || {}).forEach(([id, p]) => {
                if (p.isSpectator) return;
                if (p.isAlive) {
                  alive++;
                  if (latestRoomData.dayConfirmed && latestRoomData.dayConfirmed[id]) confirmed++;
                }
              });
              if (alive > 0 && alive === confirmed && !dayVoteFinalizing) {
                dayVoteFinalizing = true;
                calculateDayVoteResult(latestRoomData);
                return;
              }
            }
            // 倒數顯示
            if (!latestRoomData.voteEndTime) return;
            let left = Math.max(0, Math.ceil((latestRoomData.voteEndTime - Date.now()) / 1000));
            let el = document.getElementById('vote-timer-val');
            if (el) el.innerText = left;
            if (left <= 0) {
              clearInterval(voteTimerInterval);
              voteTimerInterval = null;
              if (isHost && !latestRoomData.dayResultText && !dayVoteFinalizing) {
                dayVoteFinalizing = true;
                calculateDayVoteResult(latestRoomData);
              }
            }
          }, 500);
        }

        if (isHost) {
          hostControls.classList.remove('hidden');
          if (!roomData.dayResultText) {
            btnHostNext.innerText = "⏱️ 提前結束並結算";
            btnHostNext.disabled = false;
            btnHostNext.onclick = () => calculateDayVoteResult(latestRoomData);
          } else if (roomData.winner) {
            btnHostNext.innerText = "查看勝負結果";
            btnHostNext.disabled = false;
            btnHostNext.onclick = () => update(ref(db, `rooms/${currentRoomId}`), { phase: 'GAME_OVER' });
          } else if (roomData.dayEliminatedId) {
            btnHostNext.innerText = "下一步 (進入遺言時間)";
            btnHostNext.disabled = false;
            btnHostNext.onclick = () => update(ref(db, `rooms/${currentRoomId}`), { phase: 'LAST_WORDS' });
          } else {
            let nextRound = (roomData.round || 1) + 1;
            btnHostNext.innerText = `🌙 進入第 ${nextRound} 晚`;
            btnHostNext.disabled = false;
            btnHostNext.onclick = () => update(ref(db, `rooms/${currentRoomId}`), nightResetUpdates(nextRound));
          }
        }
      }
      // --- 7.5 死者遺言階段 ---
      else if (roomData.phase === 'LAST_WORDS') {
        let eliminated = roomData.dayEliminatedId ? roomData.players[roomData.dayEliminatedId] : null;
        gameContent.innerHTML = baseHTML + `
          <h2>🕯️ 遺言時間</h2>
          <p style="font-size:20px; margin: 20px 0; line-height:1.8;">
            <b style="color:#e23b3b; font-size:28px;">${eliminated ? eliminated.name : '該玩家'}</b> 已被放逐<br>
            請發表最後遺言，其餘玩家請安靜聆聽
          </p>`;

        if (isHost) {
          hostControls.classList.remove('hidden');
          let nextRound = (roomData.round || 1) + 1;
          btnHostNext.innerText = `🌙 進入第 ${nextRound} 晚`;
          btnHostNext.disabled = false;
          btnHostNext.onclick = () => update(ref(db, `rooms/${currentRoomId}`), nightResetUpdates(nextRound));
        }
      }
    }

    // 狼人回合推進：targetId 有值則記錄擊殺目標，null 表示強制無人被殺
    function advanceFromWolf(roomData, targetId) {
      let updates = {};
      const effectiveKilledByWolf = targetId || null;
      updates[`rooms/${currentRoomId}/killedByWolf`] = effectiveKilledByWolf;
      // 計算結算時需讀到有效值（updates 尚未寫回 DB）
      const effectiveRoomData = { ...roomData, killedByWolf: effectiveKilledByWolf };

      if (hasRoleInGame(roomData, '警察')) {
        updates[`rooms/${currentRoomId}/phase`] = 'NIGHT_POLICE';
      } else if (hasRoleInGame(roomData, '醫生')) {
        updates[`rooms/${currentRoomId}/phase`] = 'NIGHT_DOCTOR';
      } else if (hasRoleInGame(roomData, '女巫')) {
        updates[`rooms/${currentRoomId}/phase`] = 'NIGHT_WITCH';
      } else {
        calculateNightEndViaData(effectiveRoomData, updates);
        update(ref(db), updates);
        return;
      }
      update(ref(db), updates);
    }

    function calculateNightEndViaData(roomData, updates) {
      let deaths = [];
      let killedByWolf = roomData.killedByWolf;
      let doctorTarget = roomData.doctorTarget;
      let witchAct = roomData.witchAction;

      if (killedByWolf) {
        let isSavedByDoctor = (doctorTarget && doctorTarget === killedByWolf);
        let isSavedByWitch = (witchAct && witchAct.type === 'heal' && witchAct.target === killedByWolf);

        if (!isSavedByDoctor && !isSavedByWitch) {
          deaths.push(killedByWolf);
        }
      }

      if (witchAct && witchAct.type === 'poison') {
        if (!deaths.includes(witchAct.target)) {
          deaths.push(witchAct.target);
        }
      }

      deaths.forEach(id => {
        updates[`rooms/${currentRoomId}/players/${id}/isAlive`] = false;
      });
      updates[`rooms/${currentRoomId}/lastNightDeaths`] = deaths.length > 0 ? deaths : null;

      // 勝負判定
      let winner = checkWinnerAfterDeaths(roomData, deaths);
      if (winner) {
        updates[`rooms/${currentRoomId}/winner`] = winner;
        updates[`rooms/${currentRoomId}/phase`] = 'GAME_OVER';
      } else {
        updates[`rooms/${currentRoomId}/phase`] = 'NIGHT_END';
      }
    }

    function calculateDayVoteResult(roomData) {
      if (roomData.dayResultText) return; // 避免時間到 + 手動點擊重複結算

      let updates = {};
      let resultText = "";
      let eliminatedId = null;
      let newlyDead = [];

      if (!roomData.dayVotes || Object.keys(roomData.dayVotes).length === 0) {
        resultText = "時間到，大家皆未投票，今日無人出局。";
      } else {
        let voteCounts = {};
        Object.values(roomData.dayVotes).forEach(targetId => {
          voteCounts[targetId] = (voteCounts[targetId] || 0) + 1;
        });

        let maxVotes = 0;
        let topTargets = [];
        for (let targetId in voteCounts) {
          let count = voteCounts[targetId];
          if (count > maxVotes) {
            maxVotes = count;
            topTargets = [targetId];
          } else if (count === maxVotes) {
            topTargets.push(targetId);
          }
        }

        if (maxVotes <= 1 || topTargets.length > 1) {
          resultText = `最高票數為 ${maxVotes} 票，但由於出現同票或票數不足，今日無人被淘汰！`;
        } else {
          eliminatedId = topTargets[0];
          newlyDead = [eliminatedId];
          let eliminatedPlayer = roomData.players[eliminatedId];
          updates[`rooms/${currentRoomId}/players/${eliminatedId}/isAlive`] = false;
          resultText = `<b>${eliminatedPlayer ? eliminatedPlayer.name : '未知'}</b> 獲得最高票 (${maxVotes}票) 而不幸出局！`;
        }
      }

      updates[`rooms/${currentRoomId}/dayResultText`] = resultText;
      updates[`rooms/${currentRoomId}/dayEliminatedId`] = eliminatedId;
      updates[`rooms/${currentRoomId}/voteEndTime`] = Date.now(); // 停止倒數顯示

      // 勝負判定
      let winner = checkWinnerAfterDeaths(roomData, newlyDead);
      if (winner) {
        updates[`rooms/${currentRoomId}/winner`] = winner;
      }

      update(ref(db), updates).catch(err => {
        console.error('白天投票結算寫入失敗：', err);
        alert('投票結果寫入失敗，請再試一次：' + err.message);
      });
    }

    function getPhaseName(phase) {
      const map = {
        'CARD_REVEAL': '確認身分',
        'DAY_DISCUSS': '白天發言',
        'NIGHT_WOLF': '狼人行動',
        'NIGHT_POLICE': '警察行動',
        'NIGHT_DOCTOR': '醫生行動',
        'NIGHT_WITCH': '女巫行動',
        'NIGHT_END': '天亮結算',
        'DAY_VOTE': '白天投票',
        'LAST_WORDS': '遺言時間',
        'GAME_OVER': '遊戲結束'
      };
      return map[phase] || '未知';
    }

    window.voteAction = function(voteNode, targetId) {
      if (isSpectator) return alert("觀眾無法參與投票！");
      // 白天投票已鎖定則不允許改票
      if (voteNode === 'dayVotes' && latestRoomData && latestRoomData.dayConfirmed && latestRoomData.dayConfirmed[myPlayerId]) {
        return alert("你已按下「決定」鎖定，請先取消決定才能更改投票。");
      }
      // 狼人已鎖定則不允許改選
      if (voteNode === 'wolfVotes' && latestRoomData && latestRoomData.wolfLocked && latestRoomData.wolfLocked[myPlayerId]) {
        return alert("你已鎖定擊殺目標，請先取消鎖定才能更改。");
      }
      const path = `rooms/${currentRoomId}/${voteNode}/${myPlayerId}`;
      const currentVote = latestRoomData && latestRoomData[voteNode] ? latestRoomData[voteNode][myPlayerId] : null;
      if (currentVote === targetId) {
        remove(ref(db, path)).catch(err => alert("撤回投票失敗，請再試一次：" + err.message));
      } else {
        set(ref(db, path), targetId).catch(err => alert("投票失敗，請再試一次：" + err.message));
      }
    };

    window.confirmWolfLock = function() {
      if (isSpectator || myRole !== '狼人') return;
      let myVote = latestRoomData && latestRoomData.wolfVotes ? latestRoomData.wolfVotes[myPlayerId] : null;
      if (!myVote) return alert("請先選擇要擊殺的對象再鎖定。");
      set(ref(db, `rooms/${currentRoomId}/wolfLocked/${myPlayerId}`), true)
        .catch(err => alert("鎖定失敗，請再試一次：" + err.message));
    };

    window.cancelWolfLock = function() {
      if (isSpectator) return;
      remove(ref(db, `rooms/${currentRoomId}/wolfLocked/${myPlayerId}`))
        .catch(err => alert("取消失敗，請再試一次：" + err.message));
    };

    window.hostPeek = function(id) {
      if (!isHost) return;
      if (hostPeekIds.has(id)) hostPeekIds.delete(id); else hostPeekIds.add(id);
      if (latestRoomData) renderGamePhase(latestRoomData, lastActivePlayers);
    };

    window.confirmDayVote = function() {
      if (isSpectator) return alert("觀眾無法參與投票！");
      set(ref(db, `rooms/${currentRoomId}/dayConfirmed/${myPlayerId}`), true)
        .catch(err => alert("鎖定失敗，請再試一次：" + err.message));
    };

    window.cancelDayVote = function() {
      if (isSpectator) return;
      remove(ref(db, `rooms/${currentRoomId}/dayConfirmed/${myPlayerId}`))
        .catch(err => alert("取消失敗，請再試一次：" + err.message));
    };

    window.confirmPolice = function(targetId) {
      set(ref(db, `rooms/${currentRoomId}/policeResult`), targetId)
        .catch(err => alert("確認失敗，請再試一次：" + err.message));
    };

    window.doctorAction = function(targetId) {
      if (isSpectator) return;
      set(ref(db, `rooms/${currentRoomId}/doctorTarget`), targetId)
        .catch(err => alert("選擇失敗，請再試一次：" + err.message));
    };

    window.witchAction = function(type, targetId) {
      if (isSpectator) return;
      let updates = {};
      updates[`rooms/${currentRoomId}/witchAction`] = { type: type, target: targetId };
      if (type === 'heal') updates[`rooms/${currentRoomId}/witchState/hasHeal`] = false;
      if (type === 'poison') updates[`rooms/${currentRoomId}/witchState/hasPoison`] = false;
      update(ref(db), updates);
    };

    window.toggleRole = function() {
      if (isSpectator) return;
      localRoleFlipped = !localRoleFlipped;
      if (latestRoomData) renderGamePhase(latestRoomData, lastActivePlayers);
    };

    window.adjustRole = function(role, change) {
      if (roleCounts[role] + change < 0) return;
      roleCounts[role] += change;
      if (isHost && currentRoomId) {
        set(ref(db, `rooms/${currentRoomId}/roleCounts/${role}`), roleCounts[role])
          .catch(err => console.error(err));
      }
      updateRoleSettingsUI();
    };

    function updateRoleSettingsUI() {
      let totalSelectedRoles = 0;
      for (let role in roleCounts) {
        if(document.getElementById(`count-${role}`)) {
          document.getElementById(`count-${role}`).innerText = roleCounts[role];
        }
        totalSelectedRoles += roleCounts[role];
      }
      document.getElementById('role-summary').innerText = `身分總數：${totalSelectedRoles} / 參賽玩家：${currentPlayersCount} 人`;

      const startBtn = document.getElementById('start-btn');
      if (isHost) {
        document.getElementById('host-role-settings').classList.remove('hidden');
        document.getElementById('role-summary-readonly').classList.add('hidden');
        if (totalSelectedRoles === currentPlayersCount && currentPlayersCount > 0) {
          startBtn.disabled = false;
          startBtn.innerText = "身分相符，正式發牌！";
        } else {
          startBtn.disabled = true;
          startBtn.innerText = `身分數量與玩家人數不符 (${totalSelectedRoles}/${currentPlayersCount})`;
        }
      } else {
        document.getElementById('host-role-settings').classList.add('hidden');
        document.getElementById('role-summary-readonly').classList.remove('hidden');
        let listHtml = "";
        for (let role in roleCounts) {
          let info = roleInfo[role] || { icon: '❓' };
          listHtml += `<div class="role-readonly-row"><span>${info.icon} ${role}</span><span class="badge">${roleCounts[role]}</span></div>`;
        }
        listHtml += `<p style="font-size:14px; color:var(--gold); margin-top:10px;">身分總數：${totalSelectedRoles} / 參賽玩家：${currentPlayersCount} 人</p>`;
        document.getElementById('role-readonly-list').innerHTML = listHtml;
      }
    }

    window.startGame = function() {
      let rolesPool = [];
      for (let role in roleCounts) {
        for (let i = 0; i < roleCounts[role]; i++) { rolesPool.push(role); }
      }
      rolesPool.sort(() => Math.random() - 0.5);

      onValue(ref(db, `rooms/${currentRoomId}/players`), (snapshot) => {
        const players = snapshot.val();
        if (!players) return;

        let activeIds = Object.keys(players).filter(id => !players[id].isSpectator).sort((a, b) => players[a].joinedAt - players[b].joinedAt);
        let updates = {};
        activeIds.forEach((id, index) => {
          if (rolesPool[index]) {
            updates[`rooms/${currentRoomId}/players/${id}/role`] = rolesPool[index];
            updates[`rooms/${currentRoomId}/players/${id}/isAlive`] = true;
          }
        });
        updates[`rooms/${currentRoomId}/phase`] = 'CARD_REVEAL';
        updates[`rooms/${currentRoomId}/roleCounts`] = roleCounts;
        updates[`rooms/${currentRoomId}/witchState`] = { hasHeal: true, hasPoison: true };
        updates[`rooms/${currentRoomId}/round`] = 1;
        updates[`rooms/${currentRoomId}/winner`] = null;
        update(ref(db), updates);
      }, { onlyOnce: true });
    };

    window.restartGame = function() {
      if (!confirm("確定要重新開始遊戲嗎？所有人將回到大廳重新選位發牌。")) return;
      onValue(ref(db, `rooms/${currentRoomId}/players`), (snapshot) => {
        const players = snapshot.val();
        if (!players) return;
        let updates = {
          [`rooms/${currentRoomId}/phase`]: 'LOBBY',
          [`rooms/${currentRoomId}/wolfVotes`]: null,
          [`rooms/${currentRoomId}/wolfLocked`]: null,
          [`rooms/${currentRoomId}/policeVotes`]: null,
          [`rooms/${currentRoomId}/policeResult`]: null,
          [`rooms/${currentRoomId}/doctorTarget`]: null,
          [`rooms/${currentRoomId}/witchAction`]: null,
          [`rooms/${currentRoomId}/killedByWolf`]: null,
          [`rooms/${currentRoomId}/lastNightDeaths`]: null,
          [`rooms/${currentRoomId}/witchState`]: null,
          [`rooms/${currentRoomId}/dayVotes`]: null,
          [`rooms/${currentRoomId}/dayConfirmed`]: null,
          [`rooms/${currentRoomId}/dayResultText`]: null,
          [`rooms/${currentRoomId}/dayEliminatedId`]: null,
          [`rooms/${currentRoomId}/voteEndTime`]: null,
          [`rooms/${currentRoomId}/round`]: null,
          [`rooms/${currentRoomId}/winner`]: null
        };
        for (let id in players) {
          updates[`rooms/${currentRoomId}/players/${id}/role`] = players[id].isSpectator ? "觀眾" : "未分配";
          updates[`rooms/${currentRoomId}/players/${id}/isAlive`] = true;
        }
        update(ref(db), updates);
      }, { onlyOnce: true });
    };

    window.closeRoom = function() {
      if (!confirm("確定要關閉房間嗎？所有玩家將被剔除回到首頁。")) return;
      remove(ref(db, 'rooms/' + currentRoomId));
    };
  </script>
</head>
<body>

  <div id="host-controls" class="hidden">
    <button class="btn-secondary" onclick="restartGame()">🔄 重新開始</button>
    <button class="btn-danger" onclick="closeRoom()">❌ 關閉房間</button>
  </div>

  <h1 class="game-title">死或活</h1>
  <div class="game-sub">W E R E W O L F</div>
  <div class="moon-divider">🌙</div>
  <p id="room-info-bar" style="color: var(--gold); font-weight: bold; letter-spacing:0.06em;"></p>

  <div id="home-area" class="card">
    <div id="home-menu">
      <div class="home-hero">
        <div class="claw">🩸 🐺 🩸</div>
        <h3 style="font-size:22px; letter-spacing:0.1em; margin:10px 0 4px;">準備好你的陰謀了嗎</h3>
        <p style="color:var(--bone-dim); font-size:14px; margin:4px 0;">入夜之後，誰都不可信賴。</p>
      </div>
      <div class="moon-divider">⚔</div>
      <div class="home-cta">
        <button class="btn-danger" onclick="showCreateRoomMenu()">➕ 建立房間 · 成為房主</button>
        <button class="btn-secondary" onclick="showJoinRoomMenu()">🔑 加入房間 · 入座獵殺</button>
      </div>
      <p class="home-note">存活，或被吞噬。</p>
    </div>
    <div id="create-room-form" class="hidden">
      <h3>🩸 建立新房間</h3>
      <input type="text" id="hostName" placeholder="輸入您的暱稱"><br>
      <input type="number" id="maxPlayers" placeholder="設定玩家上限人數 (例如: 6)" value="6"><br><br>
      <button class="btn-danger" onclick="createRoom()">建立並進入</button>
      <button class="btn-ghost" onclick="showHomeMenu()">返回</button>
    </div>
    <div id="join-room-form" class="hidden">
      <h3>🔑 加入房間</h3>
      <input type="number" id="joinRoomId" placeholder="輸入 3 位數字房間代碼"><br>
      <input type="text" id="joinName" placeholder="輸入您的暱稱"><br><br>
      <button class="btn-secondary" onclick="joinRoom()">加入</button>
      <button class="btn-ghost" onclick="showHomeMenu()">返回</button>
    </div>
  </div>

  <div id="lobby-area" class="card hidden">
    <h3>🎮 遊戲座位 (參賽：<span id="player-count">0</span> 人)</h3>
    <div id="player-slots" style="max-width: 260px; margin: 10px auto;"></div>
    <div id="seat-controls">
      <button id="btn-join-game" class="btn-success hidden" onclick="toggleSeat(false)">加入遊戲列 (坐下)</button>
      <button id="btn-join-spec" class="btn-secondary hidden" onclick="toggleSeat(true)">轉為觀眾 (起身)</button>
    </div>
    <h4 style="margin-top:20px; color:var(--bone-dim);">👁️ 觀眾席列表：</h4>
    <div id="spectator-list" style="text-align:center; max-width: 260px; margin: 5px auto; color:#bbb;"></div>
    <hr style="border-color: rgba(217,178,90,0.25); margin: 20px 0;">
    <div id="host-role-settings" class="hidden">
      <h3>⚙️ 身分數量設定 (房主操作)</h3>
      <div class="role-setting"><span>🐺 狼人</span><div><button class="btn-counter" onclick="adjustRole('狼人', -1)">-</button><span id="count-狼人" class="badge">1</span><button class="btn-counter" onclick="adjustRole('狼人', 1)">+</button></div></div>
      <div class="role-setting"><span>👮 警察</span><div><button class="btn-counter" onclick="adjustRole('警察', -1)">-</button><span id="count-警察" class="badge">1</span><button class="btn-counter" onclick="adjustRole('警察', 1)">+</button></div></div>
      <div class="role-setting"><span>👨‍🌾 平民</span><div><button class="btn-counter" onclick="adjustRole('平民', -1)">-</button><span id="count-平民" class="badge">1</span><button class="btn-counter" onclick="adjustRole('平民', 1)">+</button></div></div>
      <div class="role-setting"><span>🩺 醫生</span><div><button class="btn-counter" onclick="adjustRole('醫生', -1)">-</button><span id="count-醫生" class="badge">1</span><button class="btn-counter" onclick="adjustRole('醫生', 1)">+</button></div></div>
      <div class="role-setting"><span>🧙‍♀️ 女巫</span><div><button class="btn-counter" onclick="adjustRole('女巫', -1)">-</button><span id="count-女巫" class="badge">1</span><button class="btn-counter" onclick="adjustRole('女巫', 1)">+</button></div></div>
      <div class="role-setting"><span>🏹 獵人</span><div><button class="btn-counter" onclick="adjustRole('獵人', -1)">-</button><span id="count-獵人" class="badge">1</span><button class="btn-counter" onclick="adjustRole('獵人', 1)">+</button></div></div>
      <p id="role-summary" style="font-size:14px; color:var(--gold); font-weight:bold; margin-top:15px;"></p>
      <button id="start-btn" class="btn-danger" onclick="startGame()" disabled>等待人數與身分相符...</button>
    </div>
    <div id="role-summary-readonly" class="hidden">
      <h3>⚙️ 目前身分設定</h3>
      <div id="role-readonly-list"></div>
    </div>
  </div>

  <div id="game-area" class="card hidden">
    <div id="game-content"></div>
    <div id="phase-host-controls" class="hidden">
      <button id="btn-host-next" class="btn-success" style="width: 100%; font-size: 18px; padding: 12px;">下一步</button>
    </div>
  </div>

</body>
</html>
